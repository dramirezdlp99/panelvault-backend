spring:
  datasource:
    url: ${PANELVAULT_TEST_DB_URL:jdbc:postgresql://localhost:5432/panelvault_test}

panelvault:
  security:
    jwt:
      # Secreto SOLO para pruebas automaticas: es publico a proposito y no protege nada real.
      # Decodificado dice "panelvault-test-only-secret-never-use-in-production!!".
      secret: cGFuZWx2YXVsdC10ZXN0LW9ubHktc2VjcmV0LW5ldmVyLXVzZS1pbi1wcm9kdWN0aW9uISE=
      issuer: http://panelvault.test
    two-factor:
      # Clave AES SOLO para pruebas (32 bytes). Decodificada dice "panelvault-test-only-aes-key-32b".
      encryption-key: cGFuZWx2YXVsdC10ZXN0LW9ubHktYWVzLWtleS0zMmI=
  analysis:
    engine:
      # Secreto SOLO para pruebas. En las pruebas nunca se llama al motor real.
      secret: panelvault-test-only-engine-secret-0123456789
    worker:
      # Apagado: las pruebas manejan la cola a mano para que nada la procese por su cuenta.
      enabled: false

