spring:
  application:
    name: panelvault-backend

  # Conexion a PostgreSQL. La contrasena NUNCA se escribe aqui: llega por variable de entorno.
  # Si PANELVAULT_DB_PASSWORD no existe, la aplicacion se niega a arrancar.
  datasource:
    url: ${PANELVAULT_DB_URL:jdbc:postgresql://localhost:5432/panelvault_dev}
    username: ${PANELVAULT_DB_USER:panelvault}
    password: ${PANELVAULT_DB_PASSWORD}

  jpa:
    hibernate:
      # Hibernate solo VERIFICA que las tablas coincidan con las entidades.
      # Quien crea y modifica tablas es Flyway, con migraciones versionadas.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Render asigna el puerto en la variable PORT; en local se usa 9096
  # (el 8080 esta ocupado por Jenkins en la maquina de desarrollo).
  port: ${PORT:9096}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never