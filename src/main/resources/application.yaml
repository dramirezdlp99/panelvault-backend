spring:
  application:
    name: panelvault-backend
  datasource:
    url: ${PANELVAULT_DB_URL:jdbc:postgresql://localhost:5432/panelvault_dev}
    username: ${PANELVAULT_DB_USER:panelvault}
    password: ${PANELVAULT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:9096}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

panelvault:
  security:
    jwt:
      # Clave HMAC en Base64 (minimo 32 bytes). Sin valor por defecto a proposito:
      # si falta la variable, la aplicacion no arranca.
      secret: ${PANELVAULT_JWT_SECRET}
      issuer: ${PANELVAULT_JWT_ISSUER:http://localhost:9096}
      access-token-ttl: 15m
    refresh-token-ttl: 7d
    two-factor:
      # Clave AES-256 en Base64 (exactamente 32 bytes) para cifrar los secretos TOTP.
      # Sin valor por defecto a proposito: si falta la variable, la aplicacion no arranca.
      encryption-key: ${PANELVAULT_TOTP_ENCRYPTION_KEY}
      issuer-label: PanelVault
      challenge-ttl: 5m
    attempts:
      max-failures: 5
      window: 15m

  analysis:
    engine:
      # En local el motor corre en el puerto 8001; en produccion, la URL de Render.
      base-url: ${PANELVAULT_ENGINE_URL:http://localhost:8001}
      # Secreto HMAC compartido con el motor (minimo 32 caracteres). Debe ser
      # EXACTAMENTE el mismo valor que usa el motor de IA.
      secret: ${PANELVAULT_ENGINE_SECRET}
      connect-timeout: 10s
      request-timeout: 90s
      # Render Free duerme el servicio sin uso; despertarlo puede tardar cerca de un minuto.
      wake-up-timeout: 120s
    worker:
      enabled: ${PANELVAULT_ANALYSIS_WORKER_ENABLED:true}
      poll-interval: 5s
      batch-size: 5
      lease: 3m
    retry:
      max-attempts: 5
      base-delay: 10s
      max-delay: 5m
    limits:
      max-image-bytes: 10485760
      max-active-jobs-per-user: 300

  # Capa de borde (Edge/Gateway).
  edge:
    gateway:
      # En produccion: true, para que solo el servidor de Next.js pueda llamar al backend.
      enabled: ${PANELVAULT_GATEWAY_ENABLED:false}
      # Secreto compartido con el frontend (minimo 32 caracteres). Solo se usa si enabled=true.
      secret: ${PANELVAULT_GATEWAY_SECRET:}
      max-clock-skew: 5m
      max-body-bytes: 12582912
      exempt-paths: /actuator/health
    cors:
      # Origenes de navegador permitidos, separados por comas.
      allowed-origins: ${PANELVAULT_CORS_ORIGINS:http://localhost:3000}

